name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Python syntax
        run: uv run python -m compileall -q src scripts
      - name: JavaScript syntax
        run: |
          node --check src/obs_stage/static/admin.js
          node --check src/obs_stage/static/stage.js
      - name: Tests
        run: uv run pytest -q
