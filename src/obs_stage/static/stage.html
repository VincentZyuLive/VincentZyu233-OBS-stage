<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Stage</title>
    <link rel="icon" type="image/png" href="/static/assets/obs-stage-avatar.png" />
    <link rel="stylesheet" href="/static/stage.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <main id="stage" class="stage" data-scene="no-screen">
      <div id="previewContent" class="preview-content" hidden></div>
      <svg id="stageMask" class="stage-mask" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <mask id="slotMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
            <rect x="0" y="0" width="1600" height="900" fill="white" />
          </mask>
        </defs>
        <image id="stageBackground" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice" mask="url(#slotMask)" />
      </svg>
      <div id="glowLayer" class="glow-layer"></div>
      <div id="slotBorders" class="slot-borders"></div>
      <div class="edge-line edge-line-top"></div>
      <div class="edge-line edge-line-bottom"></div>
      <header id="brand" class="brand">
        <div id="avatarWrap" class="avatar-wrap">
          <img id="avatar" class="avatar" alt="主播头像" />
        </div>
        <div class="brand-copy">
          <div class="brand-kicker">WATERCOLOR STAGE</div>
          <div id="brandTitle" class="brand-title">VincentZyu</div>
          <div id="brandSubtitle" class="brand-subtitle">点点关注点点三连谢谢喵Thanks♪(･ω･)ﾉ</div>
        </div>
      </header>
      <aside id="statusHud" class="status-hud" hidden aria-live="polite">
        <div class="status-top">
          <span id="statusPill" class="status-pill" data-state="loading">读取中</span>
          <span id="statusRoom" class="status-room">ROOM</span>
        </div>
        <div id="statusTitle" class="status-title">正在读取 B站直播间状态…</div>
        <div class="status-grid">
          <span>分区 <strong id="statusArea">--</strong></span>
          <span>人气 <strong id="statusOnline">--</strong></span>
          <span>粉丝 <strong id="statusFollowers">--</strong></span>
          <span>开播 <strong id="statusLiveTime">--</strong></span>
        </div>
        <div id="statusUpdated" class="status-updated">等待更新</div>
      </aside>
      <div id="sceneBadge" class="scene-badge">NO SCREEN</div>
      <div id="clock" class="clock">00:00</div>
      <div id="particles" class="particles" aria-hidden="true"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </main>
    <script type="module" src="/static/stage.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
